<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仪表盘 | 工厂管理端</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
  <div id="app"></div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    if (!Auth.requireAuth()) throw new Error('Unauthorized');
    const pageContent = App.initLayout('dashboard');

    const CARD = (title, value, icon, color, href, badge) => `
      <a href="${href || '#'}" class="bg-white rounded-xl shadow p-5 hover:shadow-md transition ${href ? '' : 'pointer-events-none'}">
        <div class="flex items-start justify-between">
          <div>
            <div class="flex items-center gap-2">
              <p class="text-gray-500 text-sm">${title}</p>
              ${badge ? `<span class="text-[10px] px-1.5 py-0.5 rounded-full ${badge.class}">${badge.text}</span>` : ''}
            </div>
            <p class="text-3xl font-bold text-gray-800 mt-2">${value}</p>
          </div>
          <div class="w-11 h-11 ${color} rounded-lg flex items-center justify-center">
            <span class="text-xl">${icon}</span>
          </div>
        </div>
      </a>`;

    async function loadDashboard() {
      pageContent.innerHTML = `
        <div class="mb-6 flex items-center justify-between">
          <div>
            <h1 class="text-2xl font-bold text-gray-800">仪表盘</h1>
            <p class="text-gray-500 mt-1">欢迎回来，${Auth.getUser()}！</p>
          </div>
          <div class="flex items-center gap-2 text-xs text-gray-500">
            <span id="api-status" class="inline-flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-yellow-400 animate-pulse"></span> 连接 API...</span>
          </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
          ${CARD('产品总数', '<span id="sk-0" class="skeleton">—</span>', '📦', 'bg-blue-100', 'products.html')}
          ${CARD('产品分类', '<span id="sk-1" class="skeleton">—</span>', '🗂️', 'bg-purple-100', 'categories.html')}
          ${CARD('首页 Banner', '<span id="sk-2" class="skeleton">—</span>', '🖼️', 'bg-pink-100', 'banners.html')}
          ${CARD('工厂图片', '<span id="sk-3" class="skeleton">—</span>', '🏭', 'bg-amber-100', 'gallery.html')}
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
          ${CARD('新询盘', '<span id="sk-4" class="skeleton">—</span>', '📨', 'bg-red-100', 'inquiries.html', { class: 'bg-red-600 text-white', text: 'new' })}
          ${CARD('询盘总数', '<span id="sk-5" class="skeleton">—</span>', '📬', 'bg-cyan-100', 'inquiries.html')}
          ${CARD('上架产品 / 总数', '<span id="sk-6" class="skeleton">—</span>', '✅', 'bg-green-100', 'products.html')}
        </div>

        <div class="bg-white rounded-xl shadow p-6">
          <h2 class="text-lg font-semibold text-gray-800 mb-4">快捷入口</h2>
          <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
            ${[
              ['➕', '新增产品', 'product-form.html', 'bg-blue-50 hover:bg-blue-100 text-blue-700'],
              ['🗂️', '管理分类', 'categories.html', 'bg-purple-50 hover:bg-purple-100 text-purple-700'],
              ['🖼️', '编辑 Banner', 'banners.html', 'bg-pink-50 hover:bg-pink-100 text-pink-700'],
              ['🏭', '上传工厂图', 'gallery.html', 'bg-amber-50 hover:bg-amber-100 text-amber-700'],
              ['📨', '查看询盘', 'inquiries.html', 'bg-red-50 hover:bg-red-100 text-red-700'],
            ].map(([i, t, h, c]) => `
              <a href="${h}" class="flex flex-col items-center p-4 rounded-lg transition ${c}">
                <span class="text-2xl mb-2">${i}</span>
                <span class="text-sm font-medium">${t}</span>
              </a>
            `).join('')}
          </div>
        </div>
      `;

      try {
        const health = await API.public.health();
        const s = document.getElementById('api-status');
        s.innerHTML = health.status === 'ok'
          ? '<span class="w-2 h-2 rounded-full bg-green-500"></span> API 正常'
          : '<span class="w-2 h-2 rounded-full bg-red-500"></span> API 异常';

        const stats = await API.stats();
        const d = stats.data;
        const map = { 0: d.products.total, 1: d.categories, 2: d.gallery_images, 3: d.gallery_images, 4: d.inquiries.new, 5: d.inquiries.total, 6: `${d.products.active} / ${d.products.total}` };
        // Banner 总数单独拉一次
        const banners = await API.banners.list();
        map[2] = banners.data.length;
        for (const [k, v] of Object.entries(map)) {
          const el = document.getElementById('sk-' + k);
          if (el) el.outerHTML = `<span>${v}</span>`;
        }

        const badge = document.getElementById('nav-inquiry-count');
        if (badge) badge.textContent = d.inquiries.new || '';
      } catch (err) {
        App.toast('加载失败: ' + err.message, 'error');
      }
    }

    loadDashboard();
  </script>
</body>
</html>
