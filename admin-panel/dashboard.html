<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仪表盘 | AstroWind Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
  <div id="app"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    if (!Auth.requireAuth()) throw new Error('Unauthorized');

    const pageContent = App.initLayout('dashboard');

    async function loadDashboard() {
      pageContent.innerHTML = `
        <div class="mb-6">
          <h1 class="text-2xl font-bold text-gray-800">仪表盘</h1>
          <p class="text-gray-500 mt-1">欢迎回来，${Auth.getUser()}！</p>
        </div>

        <!-- 统计卡片 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
          <div class="bg-white rounded-xl shadow p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-gray-500 text-sm">产品总数</p>
                <p class="text-3xl font-bold text-gray-800 mt-2" id="stat-total">-</p>
              </div>
              <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center">
                <span class="text-2xl">📦</span>
              </div>
            </div>
          </div>
          <div class="bg-white rounded-xl shadow p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-gray-500 text-sm">上架产品</p>
                <p class="text-3xl font-bold text-green-600 mt-2" id="stat-active">-</p>
              </div>
              <div class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center">
                <span class="text-2xl">✓</span>
              </div>
            </div>
          </div>
          <div class="bg-white rounded-xl shadow p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-gray-500 text-sm">下架产品</p>
                <p class="text-3xl font-bold text-orange-600 mt-2" id="stat-inactive">-</p>
              </div>
              <div class="w-12 h-12 bg-orange-100 rounded-lg flex items-center justify-center">
                <span class="text-2xl">⏸</span>
              </div>
            </div>
          </div>
        </div>

        <!-- 快捷操作 -->
        <div class="bg-white rounded-xl shadow p-6">
          <h2 class="text-lg font-semibold text-gray-800 mb-4">快捷操作</h2>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <a href="product-form.html" class="flex flex-col items-center p-4 bg-blue-50 hover:bg-blue-100 rounded-lg transition">
              <span class="text-2xl mb-2">➕</span>
              <span class="text-sm font-medium text-blue-700">新增产品</span>
            </a>
            <a href="products.html" class="flex flex-col items-center p-4 bg-green-50 hover:bg-green-100 rounded-lg transition">
              <span class="text-2xl mb-2">📋</span>
              <span class="text-sm font-medium text-green-700">产品列表</span>
            </a>
            <a href="products.html?search=结构件" class="flex flex-col items-center p-4 bg-purple-50 hover:bg-purple-100 rounded-lg transition">
              <span class="text-2xl mb-2">🔍</span>
              <span class="text-sm font-medium text-purple-700">搜索产品</span>
            </a>
            <a href="#" onclick="window.location.reload()" class="flex flex-col items-center p-4 bg-gray-50 hover:bg-gray-100 rounded-lg transition">
              <span class="text-2xl mb-2">🔄</span>
              <span class="text-sm font-medium text-gray-700">刷新</span>
            </a>
          </div>
        </div>
      `;

      // 加载统计数据
      try {
        const stats = await API.stats();
        document.getElementById('stat-total').textContent = stats.data.total;
        document.getElementById('stat-active').textContent = stats.data.active;
        document.getElementById('stat-inactive').textContent = stats.data.total - stats.data.active;
      } catch (err) {
        App.toast('加载统计失败: ' + err.message, 'error');
      }
    }

    loadDashboard();
  </script>
</body>
</html>
