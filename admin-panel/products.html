<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>产品管理 | AstroWind Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
  <div id="app"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    if (!Auth.requireAuth()) throw new Error('Unauthorized');

    const pageContent = App.initLayout('products');

    let currentPage = 0;
    let currentSearch = new URLSearchParams(window.location.search).get('search') || '';

    async function loadProducts() {
      pageContent.innerHTML = `
        <div class="mb-6 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
          <div>
            <h1 class="text-2xl font-bold text-gray-800">产品管理</h1>
            <p class="text-gray-500 mt-1">管理所有产品信息</p>
          </div>
          <a href="product-form.html" class="inline-flex items-center gap-2 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition">
            <span>➕</span><span>新增产品</span>
          </a>
        </div>

        <!-- 搜索栏 -->
        <div class="bg-white rounded-xl shadow p-4 mb-6">
          <div class="flex gap-3">
            <input type="text" id="search-input" placeholder="搜索产品名称、描述或标签..." value="${currentSearch}"
              class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            <button id="search-btn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg">搜索</button>
            <button id="reset-btn" class="px-4 py-2 border hover:bg-gray-100 rounded-lg">重置</button>
          </div>
        </div>

        <!-- 产品列表 -->
        <div class="bg-white rounded-xl shadow overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead class="bg-gray-50 border-b">
                <tr>
                  <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">ID</th>
                  <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">图片</th>
                  <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">产品名称</th>
                  <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">标签</th>
                  <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">状态</th>
                  <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">排序</th>
                  <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">操作</th>
                </tr>
              </thead>
              <tbody id="product-table" class="divide-y"></tbody>
            </table>
          </div>
        </div>
      `;

      const searchInput = document.getElementById('search-input');
      document.getElementById('search-btn').onclick = () => {
        currentSearch = searchInput.value;
        currentPage = 0;
        loadProducts();
      };
      document.getElementById('reset-btn').onclick = () => {
        currentSearch = '';
        currentPage = 0;
        loadProducts();
      };

      try {
        const result = await API.products.list({ limit: 100, offset: 0 });
        let products = result.data || [];

        // 客户端搜索（后端也支持，但这里简单过滤）
        if (currentSearch) {
          const q = currentSearch.toLowerCase();
          products = products.filter(p =>
            p.product_name.toLowerCase().includes(q) ||
            (p.product_tags && Array.isArray(p.product_tags) && p.product_tags.some(t => t.toLowerCase().includes(q)))
          );
        }

        const tbody = document.getElementById('product-table');
        if (products.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="7" class="px-4 py-12 text-center text-gray-500">
                <div class="text-4xl mb-2">📦</div>
                <p>暂无产品数据</p>
                <a href="product-form.html" class="text-blue-600 hover:underline mt-2 inline-block">立即添加</a>
              </td>
            </tr>
          `;
          return;
        }

        tbody.innerHTML = products.map(p => `
          <tr class="hover:bg-gray-50">
            <td class="px-4 py-3 text-sm text-gray-900">${p.id}</td>
            <td class="px-4 py-3">
              <img src="${p.image_url}" alt="" class="w-12 h-12 object-cover rounded" onerror="this.style.display='none'">
            </td>
            <td class="px-4 py-3 text-sm font-medium text-gray-900">${p.product_name}</td>
            <td class="px-4 py-3">
              <div class="flex flex-wrap gap-1">
                ${(p.product_tags || []).map(t => `<span class="px-2 py-0.5 bg-gray-100 rounded text-xs">${t}</span>`).join('')}
              </div>
            </td>
            <td class="px-4 py-3">
              ${p.is_active 
                ? '<span class="px-2 py-1 bg-green-100 text-green-700 rounded text-xs">上架</span>'
                : '<span class="px-2 py-1 bg-gray-100 text-gray-600 rounded text-xs">下架</span>'
              }
            </td>
            <td class="px-4 py-3 text-sm text-gray-500">${p.sort_order || 0}</td>
            <td class="px-4 py-3">
              <div class="flex gap-2">
                <button onclick="editProduct(${p.id})" class="text-blue-600 hover:underline text-sm">编辑</button>
                <button onclick="toggleProduct(${p.id}, ${p.is_active})" class="text-orange-600 hover:underline text-sm">
                  ${p.is_active ? '下架' : '上架'}
                </button>
                <button onclick="deleteProduct(${p.id})" class="text-red-600 hover:underline text-sm">删除</button>
              </div>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        pageContent.innerHTML = `<div class="text-center py-12 text-red-600">加载失败: ${err.message}</div>`;
      }
    }

    async function editProduct(id) {
      window.location.href = `product-form.html?id=${id}`;
    }

    async function toggleProduct(id, currentStatus) {
      const action = currentStatus ? '下架' : '上架';
      const confirmed = await App.confirm(`确定要${action}该产品吗？`);
      if (!confirmed) return;

      try {
        await API.products.toggle(id);
        App.toast(`已${action}`, 'success');
        loadProducts();
      } catch (err) {
        App.toast('操作失败: ' + err.message, 'error');
      }
    }

    async function deleteProduct(id) {
      const confirmed = await App.confirm('确定要删除该产品吗？此操作不可恢复！');
      if (!confirmed) return;

      try {
        await API.products.delete(id);
        App.toast('删除成功', 'success');
        loadProducts();
      } catch (err) {
        App.toast('删除失败: ' + err.message, 'error');
      }
    }

    loadProducts();
  </script>
</body>
</html>
