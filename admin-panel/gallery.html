<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工厂实拍管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    if (!Auth.requireAuth()) throw new Error('Unauthorized');
    const root = App.initLayout('gallery');
    const CATS = [
      { v: 'factory', t: '工厂环境' },
      { v: 'equipment', t: '设备展示' },
      { v: 'product-show', t: '产品实拍' },
      { v: 'team', t: '团队风采' },
    ];
    const catName = (v) => (CATS.find(c => c.v === v) || {}).t || v;

    function openModal(item) {
      item = item || {};
      const isEdit = !!item?.id;
      const modal = document.createElement('div');
      modal.className = 'fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4';
      modal.innerHTML = `
        <div class="bg-white rounded-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
          <div class="p-5 border-b flex justify-between items-center">
            <h3 class="font-semibold">${isEdit ? '编辑图片' : '新增图片'}</h3>
            <button data-close class="text-gray-400 hover:text-gray-700 text-xl">&times;</button>
          </div>
          <div class="p-5 space-y-4">
            <div>
              <label class="block text-sm mb-1">图片 <span class="text-red-500">*</span></label>
              <div class="flex gap-2">
                <input id="f-image_url" value="${item.image_url || ''}" class="flex-1 border rounded px-3 py-2" placeholder="https://..."/>
                <label class="px-3 py-2 bg-gray-100 hover:bg-gray-200 rounded cursor-pointer">上传
                  <input id="f-upload" type="file" accept="image/*" class="hidden"/></label>
              </div>
              ${item.image_url ? `<img src="${item.image_url}" class="mt-2 max-h-48 object-cover rounded border"/>` : ''}
            </div>
            <div class="grid grid-cols-3 gap-4">
              <div><label class="block text-sm mb-1">分类</label>
                <select id="f-category" class="w-full border rounded px-3 py-2">
                  ${CATS.map(c => `<option value="${c.v}" ${item.category === c.v ? 'selected' : ''}>${c.t}</option>`).join('')}
                </select></div>
              <div><label class="block text-sm mb-1">排序</label>
                <input id="f-sort_order" type="number" value="${item.sort_order ?? 0}" class="w-full border rounded px-3 py-2"/></div>
              <div class="flex items-end"><label class="inline-flex items-center gap-2">
                <input id="f-is_active" type="checkbox" ${item.is_active !== false ? 'checked' : ''} class="w-4 h-4"/>
                <span class="text-sm">公开</span></label></div>
            </div>
            <div><label class="block text-sm mb-1">标题</label>
              <input id="f-title" value="${item.title || ''}" class="w-full border rounded px-3 py-2" placeholder="1000 吨注塑车间"/></div>
            <div><label class="block text-sm mb-1">描述</label>
              <textarea id="f-description" rows="2" class="w-full border rounded px-3 py-2" placeholder="可选：详细描述该图片内容">${item.description || ''}</textarea></div>
          </div>
          <div class="p-5 border-t flex justify-end gap-2">
            <button data-close class="px-4 py-2 border rounded hover:bg-gray-100">取消</button>
            <button id="save-btn" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">保存</button>
          </div>
        </div>`;
      document.body.appendChild(modal);
      modal.querySelectorAll('[data-close]').forEach(b => b.onclick = () => modal.remove());
      modal.querySelector('#f-upload').onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          App.toast('上传中...', 'info');
          const r = await API.upload(file);
          modal.querySelector('#f-image_url').value = r.data.url;
          App.toast('上传成功', 'success');
        } catch (err) { App.toast('上传失败: ' + err.message, 'error'); }
      };
      modal.querySelector('#save-btn').onclick = async () => {
        const form = {
          image_url: modal.querySelector('#f-image_url').value.trim(),
          category: modal.querySelector('#f-category').value,
          sort_order: Number(modal.querySelector('#f-sort_order').value) || 0,
          is_active: modal.querySelector('#f-is_active').checked,
          title: modal.querySelector('#f-title').value.trim() || null,
          description: modal.querySelector('#f-description').value.trim() || null,
        };
        if (!form.image_url) return App.toast('图片必填', 'error');
        try {
          if (isEdit) await API.gallery.update(item.id, form);
          else await API.gallery.create(form);
          App.toast('已保存', 'success');
          modal.remove();
          loadList(currentCategory);
        } catch (err) { App.toast(err.message, 'error'); }
      };
    }

    let currentCategory = '';
    async function loadList(cat = '') {
      currentCategory = cat;
      root.innerHTML = `
        <div class="mb-6 flex justify-between items-center flex-wrap gap-3">
          <div>
            <h1 class="text-2xl font-bold text-gray-800">工厂实拍</h1>
            <p class="text-gray-500 mt-1">主站 factory 页自动从这里读取图片展示</p>
          </div>
          <div class="flex gap-2 flex-wrap">
            <select id="filter-cat" class="border rounded px-3 py-2">
              <option value="">全部分类</option>
              ${CATS.map(c => `<option value="${c.v}" ${cat === c.v ? 'selected' : ''}>${c.t}</option>`).join('')}
            </select>
            <button id="new-btn" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">➕ 上传图片</button>
          </div>
        </div>
        <div id="grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
          <div class="col-span-full text-center p-12 text-gray-400 bg-white rounded-xl shadow">加载中...</div>
        </div>`;
      document.getElementById('new-btn').onclick = () => openModal({ category: cat || 'factory' });
      document.getElementById('filter-cat').onchange = (e) => loadList(e.target.value);

      try {
        const r = await API.gallery.list(cat ? { category: cat } : {});
        const list = r.data || [];
        document.getElementById('grid').innerHTML = list.length ? list.map(g => `
          <div class="bg-white rounded-xl shadow overflow-hidden group">
            <div class="relative aspect-video bg-gray-100">
              <img src="${g.image_url}" class="w-full h-full object-cover"/>
              <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition flex items-center justify-center gap-2">
                <button data-edit="${g.id}" class="px-3 py-1.5 bg-white text-gray-800 rounded text-sm">编辑</button>
                <button data-del="${g.id}" class="px-3 py-1.5 bg-red-600 text-white rounded text-sm">删除</button>
              </div>
            </div>
            <div class="p-3">
              <div class="flex items-center justify-between">
                <span class="text-xs px-2 py-0.5 rounded bg-gray-100">${catName(g.category)}</span>
                <span class="text-xs ${g.is_active ? 'text-green-600' : 'text-gray-400'}">${g.is_active ? '公开' : '未公开'}</span>
              </div>
              <div class="font-medium truncate mt-1">${g.title || '—'}</div>
              ${g.description ? `<div class="text-xs text-gray-500 line-clamp-2">${g.description}</div>` : ''}
              <div class="text-xs text-gray-400 mt-1">排序 ${g.sort_order}</div>
            </div>
          </div>`).join('') : '<div class="col-span-full text-center p-12 text-gray-400 bg-white rounded-xl shadow">暂无图片，点击右上角上传</div>';
        document.querySelectorAll('[data-edit]').forEach(btn => btn.onclick = async () => {
          const r = await API.gallery.get(Number(btn.dataset.edit));
          openModal({ ...r.data, is_active: r.data.is_active === 1 });
        });
        document.querySelectorAll('[data-del]').forEach(btn => btn.onclick = async () => {
          if (!(await App.confirm('确认删除这张图片？'))) return;
          await API.gallery.delete(Number(btn.dataset.del));
          App.toast('已删除', 'success');
          loadList(currentCategory);
        });
      } catch (err) { App.toast(err.message, 'error'); }
    }
    loadList();
  </script>
</body>
</html>
