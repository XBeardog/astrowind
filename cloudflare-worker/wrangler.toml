name = "astrowind-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# D1 数据库
[[d1_databases]]
binding = "DB"
database_name = "astrowind-db"
database_id = "ca1f820f-214b-4302-992f-8c18386897d9"

# R2 对象存储
[[r2_buckets]]
binding = "R2"
bucket_name = "ylgr2"

# KV 存储（用于会话/缓存）
[[kv_namespaces]]
binding = "KV"
id = "9ccbdc7c35f74a4d9e64287210621d07"

# 环境变量
[vars]
ADMIN_USERNAME = "admin"
# R2 账号 ID，用于生成公网访问 URL
R2_ACCOUNT_ID = "098e350ed3fb8953c6b8548ebc49bde4"
# R2 公网访问地址（默认 r2.dev 域名，如有自定义域名可替换）
R2_PUBLIC_URL = "https://pub-098e350ed3fb8953c6b8548ebc49bde4.r2.dev"
# 密码需要在部署后通过 wrangler secret 设置
# wrangler secret put ADMIN_PASSWORD
