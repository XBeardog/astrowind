name = "astrowind-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# D1 数据库
[[d1_databases]]
binding = "DB"
database_name = "astrowind-db"
database_id = "ca1f820f-214b-4302-992f-8c18386897d9"

# R2 对象存储
[[r2_buckets]]
binding = "R2"
bucket_name = "ylgr2"

# KV 存储（用于会话/缓存）
[[kv_namespaces]]
binding = "KV"
id = "9ccbdc7c35f74a4d9e64287210621d07"

# 环境变量
[vars]
ADMIN_USERNAME = "admin"
# 图片统一由 Worker 的 /api/images/:fileName 从 R2 读取并输出，
# 不再依赖 r2.dev 公网域名，因此无需配置 R2_PUBLIC_URL / R2_ACCOUNT_ID。
# 密码需要在部署后通过 wrangler secret 设置
# wrangler secret put ADMIN_PASSWORD
